name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # CFBundleVersion is 5000 + git rev-list --count HEAD.
          fetch-depth: 0

      - name: Import Developer ID certificate
        id: sign
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if git rev-parse --is-shallow-repository | grep -qx true; then
            echo "Checkout is shallow. CFBundleVersion would not match a full clone." >&2
            exit 1
          fi
          if [ -z "${BUILD_CERTIFICATE_BASE64}" ] || [ -z "${P12_PASSWORD}" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate secrets. The app will be ad-hoc signed."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -z "${KEYCHAIN_PASSWORD}" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          fi
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Quote each existing keychain. The unquoted command substitution
          # split on spaces and dropped a path that contains whitespace.
          security list-keychains -d user > "$RUNNER_TEMP/user-keychains.txt"
          keychains=("$KEYCHAIN_PATH")
          while IFS= read -r chain; do
            chain=${chain//\"/}
            chain="${chain#"${chain%%[![:space:]]*}"}"
            chain="${chain%"${chain##*[![:space:]]}"}"
            if [ -n "$chain" ]; then
              keychains+=("$chain")
            fi
          done < "$RUNNER_TEMP/user-keychains.txt"
          security list-keychains -d user -s "${keychains[@]}"
          # sed prints every match and exits 0. head -1 would SIGPIPE sed
          # under pipefail when more than one identity is present.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)"/\1/p' | sed -n '1p')
          if [ -z "$IDENTITY" ]; then
            echo "The imported certificate has no Developer ID Application identity."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Build universal Release
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          SIGN_ID="${{ steps.sign.outputs.identity }}"
          if [ -z "$SIGN_ID" ]; then
            SIGN_ID="-"
          fi
          FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          echo "SPARKLE_FEED_URL=${FEED_URL}"
          export FEED_URL
          XCODE_ARGS=(
            -workspace gfxCardStatus.xcworkspace
            -scheme gfxCardStatus
            -configuration Release
            -derivedDataPath "${RUNNER_TEMP}/gfxcardstatus"
            ONLY_ACTIVE_ARCH=NO
            "ARCHS=arm64 x86_64"
            "CODE_SIGN_IDENTITY=${SIGN_ID}"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
            DEVELOPMENT_TEAM=""
            "SPARKLE_FEED_URL=${FEED_URL}"
          )
          if [ -n "${SPARKLE_PUBLIC_ED_KEY}" ]; then
            # Accept the bare base64 key or the <key>SUPublicEDKey</key><string>…</string>
            # snippet generate_keys prints. xcodebuild receives only the bare key.
            # The script does not print the raw variable, which must not be the private key.
            if ! SANITIZED=$(printf '%s' "$SPARKLE_PUBLIC_ED_KEY" | python3 script/sparkle_public_ed_key.py); then
              exit 1
            fi
            export SPARKLE_PUBLIC_ED_KEY="$SANITIZED"
            echo "Using a ${#SANITIZED}-character Ed25519 public key from SPARKLE_PUBLIC_ED_KEY."
            XCODE_ARGS+=("SPARKLE_PUBLIC_ED_KEY=${SANITIZED}")
          else
            echo "SPARKLE_PUBLIC_ED_KEY is not set as a repository variable or secret."
            echo "The build keeps the public key in the Release build setting."
            echo "Set the SPARKLE_PUBLIC_ED_KEY variable so a release does not depend on that checked-in key."
          fi
          xcodebuild "${XCODE_ARGS[@]}" build
          APP="${RUNNER_TEMP}/gfxcardstatus/Build/Products/Release/gfxCardStatus.app"
          BINARY="${APP}/Contents/MacOS/gfxCardStatus"
          test -d "$APP"
          lipo -info "$BINARY" | grep -q arm64
          lipo -info "$BINARY" | grep -q x86_64
          PLIST="${APP}/Contents/Info.plist" python3 script/verify_release_info_plist.py
          if [ "${{ steps.sign.outputs.mode }}" = "developer-id" ]; then
            # Sign inside-out, in the order Sparkle documents for Developer ID
            # distribution outside Xcode's archive export. codesign --deep is not
            # used for signing. --timestamp is required for notarization.
            #
            # Sparkle 2.6 and later ship Downloader.xpc with no sandbox
            # entitlement unless the framework was rebuilt with
            # DOWNLOADER_SANDBOXED_ENTITLEMENTS. Xcode's embed step signs
            # Sparkle.framework/Versions/B only; it does not strip a sandbox
            # entitlement from Downloader.xpc because the stock binary has none.
            # gfxCardStatus is not sandboxed and does not set
            # SUEnableDownloaderService, so that XPC service is not part of the
            # update path. Preserve Downloader's incoming entitlements. Do not
            # require com.apple.security.app-sandbox.
            IDENTITY="$SIGN_ID"
            ENTITLEMENTS="${GITHUB_WORKSPACE}/gfxCardStatus.entitlements"
            test -f "$ENTITLEMENTS"
            FRAMEWORK="${APP}/Contents/Frameworks/Sparkle.framework"
            SPARKLE_PATHS=(
              "${FRAMEWORK}/Versions/B/Autoupdate"
              "${FRAMEWORK}/Versions/B/Updater.app"
              "${FRAMEWORK}/Versions/B/XPCServices/Installer.xpc"
              "${FRAMEWORK}/Versions/B/XPCServices/Downloader.xpc"
              "${FRAMEWORK}/Versions/B/Sparkle"
              "${FRAMEWORK}"
            )
            for required in "${SPARKLE_PATHS[@]}" "$BINARY"; do
              if [ ! -e "$required" ]; then
                echo "Required signing path is missing: ${required}" >&2
                exit 1
              fi
            done
            entitlement_text() {
              # Entitlements are on stdout. "Executable=" is on stderr.
              codesign -d --entitlements - "$1" 2>/dev/null || true
            }
            normalize_ents() {
              printf '%s\n' "$1" | python3 script/normalize_codesign_entitlements.py
            }
            sign_runtime() {
              echo "Signing ${1}"
              codesign --force --sign "$IDENTITY" --options runtime --timestamp "$1"
            }
            require_developer_id() {
              local path="$1"
              local info ents
              echo "Verifying ${path}"
              codesign --verify --strict --verbose=2 "$path"
              info=$(codesign -d --verbose=2 "$path" 2>&1)
              printf '%s\n' "$info"
              if ! printf '%s\n' "$info" | grep -q "Authority=Developer ID Application"; then
                echo "${path} is not signed by a Developer ID Application identity." >&2
                exit 1
              fi
              if ! printf '%s\n' "$info" | grep -E -q "flags=.*runtime"; then
                echo "${path} does not have the hardened runtime." >&2
                exit 1
              fi
              if ! printf '%s\n' "$info" | grep -E -q "Timestamp=.*[0-9]"; then
                echo "${path} has no secure timestamp. Notarization would reject it." >&2
                exit 1
              fi
              ents=$(entitlement_text "$path")
              printf '%s\n' "$ents"
              if printf '%s\n' "$ents" | grep -q "com.apple.security.get-task-allow"; then
                echo "${path} requests com.apple.security.get-task-allow." >&2
                exit 1
              fi
            }
            DOWNLOADER="${FRAMEWORK}/Versions/B/XPCServices/Downloader.xpc"
            DOWNLOADER_ENTS_BEFORE=$(entitlement_text "$DOWNLOADER")
            sign_runtime "${FRAMEWORK}/Versions/B/XPCServices/Installer.xpc"
            echo "Signing ${DOWNLOADER}"
            codesign --force --sign "$IDENTITY" --options runtime --timestamp --preserve-metadata=entitlements "$DOWNLOADER"
            DOWNLOADER_ENTS_AFTER=$(entitlement_text "$DOWNLOADER")
            BEFORE_NORM=$(normalize_ents "$DOWNLOADER_ENTS_BEFORE")
            AFTER_NORM=$(normalize_ents "$DOWNLOADER_ENTS_AFTER")
            if [ "$BEFORE_NORM" != "$AFTER_NORM" ]; then
              echo "Re-signing Downloader.xpc changed its entitlements." >&2
              printf '%s\n' "$DOWNLOADER_ENTS_BEFORE" >&2
              printf '%s\n' "$DOWNLOADER_ENTS_AFTER" >&2
              exit 1
            fi
            sign_runtime "${FRAMEWORK}/Versions/B/Autoupdate"
            sign_runtime "${FRAMEWORK}/Versions/B/Updater.app"
            sign_runtime "${FRAMEWORK}"
            echo "Signing ${BINARY}"
            codesign --force --sign "$IDENTITY" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$BINARY"
            echo "Signing ${APP}"
            codesign --force --sign "$IDENTITY" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$APP"
            for signed in \
              "${FRAMEWORK}/Versions/B/XPCServices/Installer.xpc" \
              "$DOWNLOADER" \
              "${FRAMEWORK}/Versions/B/Autoupdate" \
              "${FRAMEWORK}/Versions/B/Updater.app" \
              "${FRAMEWORK}" \
              "$BINARY" \
              "$APP"
            do
              require_developer_id "$signed"
            done
            if entitlement_text "$BINARY" | grep -q "com.apple.security.cs.disable-library-validation"; then
              echo "The app executable disables library validation. That entitlement is Debug-only." >&2
              exit 1
            fi
            if printf '%s\n' "$AFTER_NORM" | grep -q "com.apple.security.app-sandbox"; then
              echo "Downloader.xpc kept the sandbox entitlement from its incoming signature."
            else
              echo "Downloader.xpc has no app-sandbox entitlement. Sparkle 2.10 ships it that way unless DOWNLOADER_SANDBOXED_ENTITLEMENTS is enabled. gfxCardStatus is not sandboxed, so this XPC service is not required for updates."
            fi
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -E -q 'flags=.*runtime'

      - name: Notarize the app
        id: notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          echo "stapled=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.sign.outputs.mode }}" != "developer-id" ]; then
            echo "Ad-hoc signed build. Skipping notarization."
            exit 0
          fi
          if [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER_ID}" ] || [ -z "${APPLE_API_KEY}" ]; then
            echo "Developer ID signed, without notarization secrets. The upload will not be stapled."
            exit 0
          fi
          APP="${RUNNER_TEMP}/gfxcardstatus/Build/Products/Release/gfxCardStatus.app"
          ZIP="${RUNNER_TEMP}/notarize.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$APPLE_API_KEY" > "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARY_JSON="${RUNNER_TEMP}/notary-app.json"
          set +e
          xcrun notarytool submit "$ZIP" \
            --key "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json > "$NOTARY_JSON"
          submit_status=$?
          set -e
          if [ ! -s "$NOTARY_JSON" ]; then
            echo "notarytool produced no JSON (exit ${submit_status})." >&2
            exit 1
          fi
          cat "$NOTARY_JSON"
          STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$NOTARY_JSON")
          SUBMISSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$NOTARY_JSON")
          echo "App notarization status=${STATUS} id=${SUBMISSION} submit_exit=${submit_status}"
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization was not Accepted. Not stapling." >&2
            if [ -n "$SUBMISSION" ]; then
              xcrun notarytool log "$SUBMISSION" \
                --key "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID"
            fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          echo "stapled=true" >> "$GITHUB_OUTPUT"

      - name: Package zip and DMG
        id: package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          APP="${RUNNER_TEMP}/gfxcardstatus/Build/Products/Release/gfxCardStatus.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Contents/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          DIST="${RUNNER_TEMP}/dist"
          mkdir -p "$DIST"
          ZIP="$DIST/gfxCardStatus-${VERSION}.zip"
          DMG="$DIST/gfxCardStatus-${VERSION}.dmg"
          ditto -c -k --keepParent "$APP" "$ZIP"
          STAGE="${RUNNER_TEMP}/dmg-root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          if [ ! -f LICENSE ]; then
            echo "Repo root LICENSE is required on the DMG and was not found." >&2
            exit 1
          fi
          cp LICENSE "$STAGE/LICENSE"
          cp README.md "$STAGE/README.md"
          if [ ! -f "$STAGE/LICENSE" ] || [ ! -d "$STAGE/gfxCardStatus.app" ]; then
            echo "LICENSE was not staged beside gfxCardStatus.app." >&2
            exit 1
          fi
          hdiutil create -volname "gfxCardStatus" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [ "${{ steps.sign.outputs.mode }}" = "developer-id" ]; then
            codesign --force --sign "${{ steps.sign.outputs.identity }}" --timestamp "$DMG"
            if [ "${{ steps.notarize.outputs.stapled }}" = "true" ]; then
              KEY_DIR="$RUNNER_TEMP/private_keys"
              NOTARY_JSON="${RUNNER_TEMP}/notary-dmg.json"
              set +e
              xcrun notarytool submit "$DMG" \
                --key "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --wait \
                --output-format json > "$NOTARY_JSON"
              submit_status=$?
              set -e
              if [ ! -s "$NOTARY_JSON" ]; then
                echo "DMG notarytool produced no JSON (exit ${submit_status})." >&2
                exit 1
              fi
              cat "$NOTARY_JSON"
              STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$NOTARY_JSON")
              SUBMISSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$NOTARY_JSON")
              echo "DMG notarization status=${STATUS} id=${SUBMISSION} submit_exit=${submit_status}"
              if [ "$STATUS" != "Accepted" ]; then
                echo "DMG notarization was not Accepted. Not stapling." >&2
                if [ -n "$SUBMISSION" ]; then
                  xcrun notarytool log "$SUBMISSION" \
                    --key "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8" \
                    --key-id "$APPLE_API_KEY_ID" \
                    --issuer "$APPLE_API_ISSUER_ID"
                fi
                exit 1
              fi
              xcrun stapler staple "$DMG"
            fi
          fi
          SOURCE_ZIP="$DIST/gfxCardStatus-${VERSION}-source.zip"
          SOURCE_TGZ="$DIST/gfxCardStatus-${VERSION}-source.tar.gz"
          git archive --format=zip --prefix="gfxCardStatus-${VERSION}/" -o "$SOURCE_ZIP" "${GITHUB_SHA}"
          git archive --format=tar.gz --prefix="gfxCardStatus-${VERSION}/" -o "$SOURCE_TGZ" "${GITHUB_SHA}"
          README_MD="$DIST/README.md"
          cp README.md "$README_MD"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "min_os=$MIN_OS"
            echo "zip=$ZIP"
            echo "dmg=$DMG"
            echo "source_zip=$SOURCE_ZIP"
            echo "source_tgz=$SOURCE_TGZ"
            echo "readme=$README_MD"
          } >> "$GITHUB_OUTPUT"

      - name: Build Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="${{ steps.package.outputs.zip }}"
          VERSION="${{ steps.package.outputs.version }}"
          BUILD="${{ steps.package.outputs.build }}"
          MIN_OS="${{ steps.package.outputs.min_os }}"
          ZIP_NAME="$(basename "$ZIP")"
          case "$ZIP_NAME" in
            gfxCardStatus-*.zip) ;;
            *)
              echo "Refusing to publish an appcast for ${ZIP_NAME}. The update archive must be gfxCardStatus-<version>.zip."
              exit 1
              ;;
          esac
          case "$ZIP_NAME" in
            *source*)
              echo "Refusing to use a source archive as the Sparkle update: ${ZIP_NAME}"
              exit 1
              ;;
          esac
          ARCHIVES="${RUNNER_TEMP}/sparkle-archives"
          rm -rf "$ARCHIVES"
          mkdir -p "$ARCHIVES"
          cp "$ZIP" "$ARCHIVES/"
          # Only this release's app zip. Do not download older gfxCardStatus-*.zip
          # files or a previous appcast.xml; generate_appcast would advertise them.
          # Source archives are gfxCardStatus-<version>-source.zip and stay in dist/.
          ARCHIVE_COUNT=$(find "$ARCHIVES" -type f | wc -l | tr -d ' ')
          if [ "$ARCHIVE_COUNT" -ne 1 ]; then
            echo "Sparkle archives directory must contain only ${ZIP_NAME}."
            find "$ARCHIVES" -type f
            exit 1
          fi
          PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          REPO_LINK="https://github.com/${GITHUB_REPOSITORY}"
          APPCAST="${RUNNER_TEMP}/dist/appcast.xml"
          rm -f "$APPCAST"
          if [ -n "${SPARKLE_PRIVATE_KEY}" ]; then
            # sign_update prints the private key on a base64 decode error, and
            # --ed-key-file - reads only one line. Write one trimmed line to a
            # mode 0600 file and redact that line out of any tool output.
            KEY_FILE="${RUNNER_TEMP}/sparkle-ed-private-key"
            rm -f "$KEY_FILE"
            cleanup_private_key() { rm -f "$KEY_FILE"; }
            trap cleanup_private_key EXIT
            printf '%s' "$SPARKLE_PRIVATE_KEY" | python3 script/sparkle_private_key.py write "$KEY_FILE"
            redact_private_key() {
              python3 script/sparkle_private_key.py redact
            }
            curl -fsSL -o "${RUNNER_TEMP}/Sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz"
            mkdir -p "${RUNNER_TEMP}/Sparkle"
            tar -xf "${RUNNER_TEMP}/Sparkle.tar.xz" -C "${RUNNER_TEMP}/Sparkle"
            # Do not use find | head. Under pipefail, head closes the pipe and
            # find exits with SIGPIPE, which fails the step.
            TOOL_LIST="${RUNNER_TEMP}/sparkle-tools.txt"
            find "${RUNNER_TEMP}/Sparkle" -type f \( -name generate_appcast -o -name sign_update \) > "$TOOL_LIST"
            GENERATE=""
            SIGN_UPDATE=""
            while IFS= read -r sparkle_tool; do
              case "$(basename "$sparkle_tool")" in
                generate_appcast)
                  if [ -z "$GENERATE" ]; then
                    GENERATE=$sparkle_tool
                  fi
                  ;;
                sign_update)
                  if [ -z "$SIGN_UPDATE" ]; then
                    SIGN_UPDATE=$sparkle_tool
                  fi
                  ;;
              esac
            done < "$TOOL_LIST"
            if [ -z "$GENERATE" ] || [ -z "$SIGN_UPDATE" ]; then
              echo "Sparkle tools archive did not contain generate_appcast and sign_update."
              exit 1
            fi
            chmod +x "$GENERATE" "$SIGN_UPDATE"
            set +e
            GEN_OUT=$("$GENERATE" \
              --ed-key-file "$KEY_FILE" \
              --download-url-prefix "$PREFIX" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o "$APPCAST" \
              "$ARCHIVES" 2>&1)
            gen_status=$?
            set -e
            printf '%s\n' "$GEN_OUT" | redact_private_key
            if [ "$gen_status" -ne 0 ]; then
              echo "generate_appcast failed. Signing the archive and writing the feed directly."
              rm -f "$APPCAST"
              set +e
              SIG_OUT=$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "$ZIP" 2>&1)
              sig_status=$?
              set -e
              SIGNATURE=$(printf '%s\n' "$SIG_OUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
              if [ "$sig_status" -ne 0 ] || [ -z "$SIGNATURE" ]; then
                echo "sign_update did not print an edSignature." >&2
                printf '%s\n' "$SIG_OUT" | redact_private_key >&2
                exit 1
              fi
              python3 script/update_appcast.py \
                --appcast "$APPCAST" \
                --link "$REPO_LINK" \
                --version "$BUILD" \
                --short-version "$VERSION" \
                --url "${PREFIX}${ZIP_NAME}" \
                --length "$(stat -f %z "$ZIP")" \
                --ed-signature "$SIGNATURE" \
                --minimum-system-version "$MIN_OS" \
                --title "Version ${VERSION}"
            else
              python3 script/update_appcast.py \
                --appcast "$APPCAST" \
                --link "$REPO_LINK" \
                --version "$BUILD"
            fi
            rm -f "$KEY_FILE"
            EXPECT_ED_SIGNATURE=1
          else
            echo "SPARKLE_PRIVATE_KEY is not set. The appcast has no EdDSA signature, so Sparkle will reject it until a signed release is published."
            python3 script/update_appcast.py \
              --appcast "$APPCAST" \
              --link "$REPO_LINK" \
              --version "$BUILD" \
              --short-version "$VERSION" \
              --url "${PREFIX}${ZIP_NAME}" \
              --length "$(stat -f %z "$ZIP")" \
              --minimum-system-version "$MIN_OS" \
              --title "Version ${VERSION}"
          fi
          test -f "$APPCAST"
          EXPECT_ED_SIGNATURE="${EXPECT_ED_SIGNATURE:-0}" python3 script/check_appcast_enclosure.py "$APPCAST" "$ZIP_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          {
            echo "gfxCardStatus ${{ steps.package.outputs.version }} (build ${{ steps.package.outputs.build }})"
            echo
            echo "Signing: ${{ steps.sign.outputs.mode }}"
            echo "Notarized: ${{ steps.notarize.outputs.stapled }}"
            echo
            echo "Sparkle reads appcast.xml from this release:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
            echo
            echo "The update archive is gfxCardStatus-${{ steps.package.outputs.version }}.zip. Source archives are not updates."
            if [ "${{ steps.sign.outputs.mode }}" != "developer-id" ]; then
              echo
              echo "This build is ad-hoc signed and was not notarized."
            elif [ "${{ steps.notarize.outputs.stapled }}" != "true" ]; then
              echo
              echo "This build is Developer ID signed and was not notarized."
            fi
          } > "$NOTES"
          ASSETS=(
            "${{ steps.package.outputs.zip }}"
            "${{ steps.package.outputs.dmg }}"
            "${{ steps.package.outputs.source_zip }}"
            "${{ steps.package.outputs.source_tgz }}"
            "${{ steps.package.outputs.readme }}"
            "${RUNNER_TEMP}/dist/appcast.xml"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "gfxCardStatus ${TAG}" --notes-file "$NOTES" "${ASSETS[@]}"
          fi
